[package]
name = "naghma-audio"
description = "Real-time pitch analysis pipeline: CPAL microphone capture, lock-free buffering and a DSP worker producing naghma-core observations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cpal = { version = "0.18", optional = true }
naghma-core.workspace = true
pitchforge.workspace = true
rtrb = "0.4"
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[features]
cpal = ["dep:cpal"]

[dev-dependencies]
pitchforge = { git = "https://github.com/MansourAZ0/pitchforge-rs", tag = "v0.1.0", features = ["signals"] }
