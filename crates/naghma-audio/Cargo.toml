[package]
name = "naghma-audio"
description = "Real-time pitch analysis pipeline: CPAL microphone capture, lock-free buffering and a DSP worker producing naghma-core observations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cpal = { version = "0.18", optional = true }
naghma-core.workspace = true
pitchforge = { workspace = true, features = ["signals"] }
rtrb = "0.4"
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true

[features]
default = ["cpal"]
## Live microphone capture via CPAL. Without it only simulation and offline analysis are available.
cpal = ["dep:cpal"]
