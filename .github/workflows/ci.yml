name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404, blacksmith-2vcpu-windows-2025]
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate dependencies while repositories are private
        if: github.event.repository.private
        shell: bash
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN || github.token }}
        run: git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  lint:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate dependencies while repositories are private
        if: github.event.repository.private
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN || github.token }}
        run: git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps --all-features

  ui:
    name: "@naghma/ui"
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: packages/naghma-ui
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate dependencies while repositories are private
        if: github.event.repository.private
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN || github.token }}
        run: git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  msrv:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate dependencies while repositories are private
        if: github.event.repository.private
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN || github.token }}
        run: git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p naghma-core --lib --all-features
