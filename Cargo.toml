[workspace]
resolver = "3"
members = ["crates/naghma-core", "crates/naghma-audio"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MansourAZ0/naghma-core"
authors = ["Mansour Aziz"]

[workspace.dependencies]
naghma-core = { path = "crates/naghma-core", version = "0.3.0" }
pitchforge = { git = "https://github.com/MansourAZ0/pitchforge-rs", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
