<style>
#maqamat-tonic-reference{font-family:var(--font-sans,system-ui);color:var(--foreground);padding:0}
#maqamat-tonic-reference h2{font-weight:500;margin:0 0 22px;text-align:start}
#maqamat-tonic-reference .controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:25px}
#maqamat-tonic-reference select{box-sizing:border-box;width:100%;min-width:0;font:inherit;padding:7px;background:var(--background);color:var(--foreground);border:1px solid var(--border)}
#maqamat-tonic-reference label{min-width:0;color:var(--muted-foreground)}
#maqamat-tonic-reference .notes{display:grid;grid-template-columns:repeat(var(--note-columns,8),minmax(0,1fr));gap:14px 8px;align-items:start;margin:28px 0}
#maqamat-tonic-reference .note{text-align:center;display:grid;gap:8px;min-width:0}
#maqamat-tonic-reference .note .arabic{overflow-wrap:normal;min-height:4.5em}
#maqamat-tonic-reference .note .latin{min-height:3em}
#maqamat-tonic-reference .note .degree,#maqamat-tonic-reference .note .cents{color:var(--muted-foreground);font-variant-numeric:tabular-nums}
#maqamat-tonic-reference .note .mark{height:3px;background:var(--chart-1);opacity:.7;margin:4px 12px}
#maqamat-tonic-reference .ajnas{display:flex;gap:10px 20px;flex-wrap:wrap;margin:25px 0}
#maqamat-tonic-reference .ajnas>span{padding-inline-start:10px;border-inline-start:2px solid var(--chart-1)}
#maqamat-tonic-reference .ajnas small{display:block;color:var(--muted-foreground)}
#maqamat-tonic-reference .legend{display:flex;gap:6px 20px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px;color:var(--muted-foreground)}
#maqamat-tonic-reference .range{color:var(--warning-foreground)}
#maqamat-tonic-reference .sources{color:var(--muted-foreground);overflow-wrap:anywhere}
#maqamat-tonic-reference a{color:var(--foreground);text-underline-offset:4px}
@media(max-width:550px){#maqamat-tonic-reference .controls{grid-template-columns:1fr;gap:12px}#maqamat-tonic-reference .notes{grid-template-columns:repeat(4,minmax(0,1fr))}}

</style>
<script>
(()=>{
  const root=document.getElementById('maqamat-tonic-reference');
  const data=JSON.parse(root.querySelector('[data-source]').textContent);
  for(const m of data.maqamat)for(const v of m.variants)v.notes=v.notes.map(row=>row.map((index,i)=>({name:data.lexicon[index],cents:v.cents[i],step:v.steps[i]})));
  const maqam=root.querySelector('[data-maqam]'),tonic=root.querySelector('[data-tonic]'),route=root.querySelector('[data-route]');
  const notes=root.querySelector('[data-notes]'),ajnas=root.querySelector('[data-ajnas]'),range=root.querySelector('[data-range]'),sources=root.querySelector('[data-sources]');
  const saved=window.openai?.widgetState?.modelContent;
  for(const m of data.maqamat)maqam.add(new Option(m.name.arabic+' · '+m.name.latin,m.id));
  data.tonics.forEach((t,i)=>tonic.add(new Option(t.ar+' · '+t.en,i)));
  maqam.value=data.maqamat.some(m=>m.id===saved?.maqam)?saved.maqam:'bayati';
  function current(){return data.maqamat.find(m=>m.id===maqam.value);}
  function routes(){route.replaceChildren();current().variants.forEach((v,i)=>route.add(new Option(v.name.arabic+' · '+v.name.latin,i)));}
  routes();tonic.value=String(saved?.tonic>=0&&saved.tonic<24?saved.tonic:current().referenceTonic);
  if(current().variants[saved?.route])route.value=String(saved.route);
  function draw(persist=false){
    const m=current(),v=m.variants[Number(route.value)],sequence=v.notes[Number(tonic.value)];
    notes.replaceChildren();notes.style.setProperty("--note-columns",sequence.length>8?5:8);ajnas.replaceChildren();sources.replaceChildren();
    sequence.forEach(n=>{
      const el=document.createElement('div');el.className='note';
      const degree=document.createElement('span');degree.className='degree';degree.textContent=n.step+1;
      const arabic=document.createElement('span');arabic.className='arabic';arabic.dir='rtl';arabic.textContent=n.name.ar;
      const latin=document.createElement('span');latin.className='latin';latin.textContent=n.name.en;
      const mark=document.createElement('span');mark.className='mark';mark.setAttribute('aria-hidden','true');
      const cents=document.createElement('span');cents.className='cents';cents.textContent=n.cents+' ¢';
      el.append(degree,arabic,latin,mark,cents);notes.append(el);
    });
    v.ajnas.forEach(j=>{const el=document.createElement('span');el.textContent=j.name.arabic+' · '+j.name.latin;const detail=document.createElement('small');detail.textContent='الدرجة '+j.degree+' · المركز النغمي '+j.tonicDegree;el.append(detail);ajnas.append(el);});
    range.textContent=m.repeating?'':'صبا: الصورة في سجل القرار المختار؛ لا تُكرر تلقائياً بالأوكتاف. Saba: register-specific illustration; no automatic octave repetition.';
    const label=document.createElement('span');label.textContent='Sources / المصادر: ';sources.append(label);
    for(const url of m.sources){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noreferrer';a.textContent='MaqamWorld ↗';sources.append(a);}
    if(persist&&window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{maqam:m.id,tonic:Number(tonic.value),route:Number(route.value)}}).catch(()=>{});
  }
  maqam.addEventListener('change',()=>{routes();tonic.value=String(current().referenceTonic);draw(true);});tonic.addEventListener('change',()=>draw(true));route.addEventListener('change',()=>draw(true));
  draw();
  const bayati=data.maqamat.find(m=>m.id==='bayati');
  console.assert(bayati.variants[0].notes[18][5].name.en==='Fa','Bayati La primary sixth');
  console.assert(bayati.variants[1].notes[18][5].name.en==='Fa half-sharp','Bayati La Rast sixth');
  console.log('Eight maqamat, 24 tonic classes and source-specific routes loaded; Bayati La spelling checks passed.');
})();
